# Example stack: the controller plus one container that declares a DNS record.
#
# Prerequisites (one time only):
#   Create a Cloudflare API token with Zone > DNS > Edit on the zones you want
#   to manage, and export it as CLOUDFLARE_API_TOKEN.
#
# The controller only ever touches records it created (tracked with companion
# TXT records), so it is safe to run alongside manually managed DNS entries.

services:
  externaldns-controller:
    image: ronaldmiranda/docker-externaldns-controller:latest
    build: .
    environment:
      PROVIDER: cloudflare
      OWNER_ID: default # this will be on TXT record to keep track of managed entries
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # OWNER_ID: my-host             # default: container/host hostname
      # LABEL_PREFIX: externaldns     # default
      # TXT_PREFIX: externaldns-      # default
      # DOMAIN_FILTER: example.com    # default: all zones the token can see
      # DEFAULT_TARGET: 203.0.113.10  # fallback IP for A records without a target
      # ENABLE_TRAEFIK: "true"        # default; read Traefik Host() labels too
      # RESYNC_INTERVAL: 5m           # default
      # DRY_RUN: "false"              # default
      # LOG_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image runs as a non-root user; add the GID of the group that owns the
    # socket so it can be read. Find it with: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    restart: unless-stopped

  # Example: publishes an A record whoami.example.com -> 203.0.113.10 using the
  # native externaldns labels.
  whoami:
    image: traefik/whoami
    labels:
      externaldns.hostname: whoami.example.com
      externaldns.type: "A"
      externaldns.target: "203.0.113.10"
    restart: unless-stopped

  # Example: no externaldns labels at all — the hostname is taken from the
  # Traefik router rule and published as an A record to DEFAULT_TARGET. Set
  # DEFAULT_TARGET (e.g. the host's public IP) on the controller above to use
  # this. Disable Traefik support with ENABLE_TRAEFIK: "false".
  dashboard:
    image: traefik/whoami
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`dashboard.example.com`)
    restart: unless-stopped
