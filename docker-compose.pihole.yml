# Example: manage Pi-hole v6 local DNS from container labels.
#
# The Pi-hole provider authenticates with the web/API password and manages the
# "<ip> <hostname>" local DNS entries (A/AAAA records). It defaults to the noop
# registry (Pi-hole cannot store ownership TXT records), so ALWAYS set
# DOMAIN_FILTER to scope what it manages.

services:
  externaldns-controller:
    image: ronaldmiranda/docker-externaldns-controller:latest
    build: .
    environment:
      PROVIDER: pihole
      OWNER_ID: default # this will be on TXT record to keep track of managed entries
      PIHOLE_URL: http://pi.hole
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      DOMAIN_FILTER: home.example.com # scope: only names under this domain
      DEFAULT_TARGET: 192.168.1.10 # host IP used for A records without a target
      # PIHOLE_TLS_INSECURE: "true"  # if Pi-hole serves the API over self-signed https
      # ENABLE_TRAEFIK: "true"       # default; Traefik Host() labels become hosts too
      # LOG_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-999}"
    # Hardening: the Docker socket already grants control of the host, so
    # shrink the rest of the container's attack surface.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Publishes the local DNS entry: 192.168.1.20 nas.home.example.com
  nas:
    image: traefik/whoami
    labels:
      externaldns.hostname: nas.home.example.com
      externaldns.target: "192.168.1.20"
    restart: unless-stopped
